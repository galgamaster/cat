<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>猫娘 AI</title>
<style>
  :root {
    --bg: #fff7fa;
    --panel: #ffffff;
    --panel-2: #ffeef5;
    --border: #f6d8e4;
    --text: #54424e;
    --muted: #b28aa0;
    --accent: #ff7eb3;
    --accent-2: #b79aff;
    --user-bubble: linear-gradient(135deg, #ff8fb3, #c9a7ff);
    --danger: #ff6b8b;
    --radius: 16px;
    --shadow: 0 8px 30px rgba(200, 120, 160, .22);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
    background: linear-gradient(135deg, #fff5f9 0%, #f7f0ff 55%, #fff5f9 100%);
    background-attachment: fixed;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  .app {
    display: flex;
    height: 100%;
    overflow: hidden;
  }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 280px;
    min-width: 280px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    transition: transform .25s ease;
  }

  .sidebar-head {
    padding: 18px 16px 12px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: .3px;
  }

  .brand .logo {
    width: 32px;
    height: 32px;
    border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid;
    place-items: center;
    font-size: 17px;
  }

  .new-chat {
    margin-top: 14px;
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--panel-2);
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
    text-align: left;
    transition: border-color .15s, transform .05s;
  }

  .new-chat:hover { border-color: var(--accent); }
  .new-chat:active { transform: scale(.99); }

  .conv-list {
    flex: 1;
    overflow-y: auto;
    padding: 6px 10px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .conv-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    color: var(--muted);
    border: 1px solid transparent;
    transition: background .12s, color .12s;
    position: relative;
  }

  .conv-item:hover { background: var(--panel-2); color: var(--text); }
  .conv-item.active {
    background: var(--panel-2);
    color: var(--text);
    border-color: var(--border);
  }

  .conv-title {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .conv-del {
    opacity: 0;
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    padding: 2px 6px;
    border-radius: 6px;
  }

  .conv-item:hover .conv-del { opacity: 1; }
  .conv-del:hover { color: var(--danger); background: rgba(255,107,107,.12); }

  .sidebar-foot {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .settings-btn {
    flex: 1;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    font-size: 13px;
  }

  .settings-btn:hover { background: var(--panel-2); }

  /* ---------- Main ---------- */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .main-head {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--bg);
  }

  .menu-btn {
    display: none;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    border-radius: 8px;
    padding: 7px 10px;
    cursor: pointer;
  }

  .head-title {
    flex: 1;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .model-pill {
    font-size: 12px;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 5px 10px;
    border-radius: 999px;
    background: var(--panel);
    max-width: 220px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .head-gear {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    border-radius: 8px;
    padding: 7px 10px;
    cursor: pointer;
    font-size: 16px;
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20px;
    scroll-behavior: smooth;
  }

  .messages-inner {
    max-width: 820px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* Empty state */
  .empty {
    margin: auto;
    text-align: center;
    max-width: 520px;
    padding: 40px 20px;
  }

  .empty h1 {
    font-size: 26px;
    margin: 0 0 8px;
  }

  .empty p { color: var(--muted); margin: 0 0 26px; line-height: 1.6; }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
  }

  .chip {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    padding: 10px 16px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 14px;
    transition: border-color .15s, background .15s;
  }

  .chip:hover { border-color: var(--accent); background: var(--panel-2); }

  /* Message */
  .msg { display: flex; gap: 12px; }

  .msg.user { justify-content: flex-end; }

  .avatar {
    width: 38px;
    height: 38px;
    min-width: 38px;
    border-radius: 50%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    display: grid;
    place-items: center;
    font-size: 16px;
    overflow: hidden;
  }

  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .msg-body { min-width: 0; flex: 1; }

  .msg-tools { margin-top: 8px; }

  .speak-btn {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--muted);
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 12px;
    cursor: pointer;
    transition: color .15s, border-color .15s;
  }

  .speak-btn:hover { color: var(--accent); border-color: var(--accent); }

  .user-bubble {
    background: var(--user-bubble);
    padding: 12px 16px;
    border-radius: 16px 16px 4px 16px;
    max-width: 78%;
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.6;
    font-size: 15px;
  }

  .content {
    font-size: 15px;
    line-height: 1.75;
    word-break: break-word;
  }

  .content p { margin: 0 0 10px; }
  .content p:last-child { margin-bottom: 0; }
  .content h1, .content h2, .content h3, .content h4, .content h5, .content h6 {
    margin: 18px 0 10px;
    line-height: 1.35;
  }
  .content h1:first-child, .content h2:first-child, .content h3:first-child { margin-top: 0; }
  .content ul, .content ol { margin: 0 0 10px; padding-left: 22px; }
  .content li { margin: 4px 0; }
  .content blockquote {
    margin: 0 0 10px;
    padding: 8px 14px;
    border-left: 3px solid var(--accent);
    background: var(--panel);
    border-radius: 0 8px 8px 0;
    color: var(--muted);
  }
  .content code {
    background: var(--panel-2);
    padding: 2px 6px;
    border-radius: 6px;
    font-size: .9em;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  .content a { color: var(--accent); }
  .content pre {
    margin: 0;
    overflow-x: auto;
    padding: 14px;
  }
  .content pre code { background: transparent; padding: 0; }

  .code-block {
    background: #fbf5f8;
    border: 1px solid var(--border);
    border-radius: 10px;
    margin: 10px 0;
    overflow: hidden;
  }

  .code-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 7px 12px;
    background: var(--panel-2);
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted);
  }

  .copy-btn {
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 12px;
    padding: 3px 8px;
    border-radius: 6px;
  }

  .copy-btn:hover { color: var(--text); background: rgba(0,0,0,.05); }

  .reasoning { margin-bottom: 10px; }
  .reasoning.hidden { display: none; }
  .reasoning details {
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--panel);
    overflow: hidden;
  }
  .reasoning summary {
    cursor: pointer;
    padding: 9px 12px;
    color: var(--muted);
    font-size: 13px;
    user-select: none;
  }
  .reasoning-body {
    padding: 10px 12px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 13px;
    white-space: pre-wrap;
    line-height: 1.6;
    max-height: 260px;
    overflow-y: auto;
  }

  .cursor {
    display: inline-block;
    width: 8px;
    height: 16px;
    background: var(--accent);
    border-radius: 2px;
    vertical-align: -2px;
    animation: blink 1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* Input */
  .input-wrap {
    padding: 14px 20px 18px;
  }

  .input-inner {
    max-width: 820px;
    margin: 0 auto;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 10px 12px;
    transition: border-color .15s;
  }

  .input-inner:focus-within { border-color: var(--accent); }

  .input-inner textarea {
    flex: 1;
    resize: none;
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    font-size: 15px;
    line-height: 1.5;
    max-height: 180px;
    font-family: inherit;
    padding: 6px 4px;
  }

  .send-btn {
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    width: 42px;
    height: 42px;
    cursor: pointer;
    font-size: 17px;
    display: grid;
    place-items: center;
    transition: opacity .15s, transform .05s;
  }

  .send-btn:disabled { opacity: .45; cursor: not-allowed; }
  .send-btn:not(:disabled):active { transform: scale(.95); }
  .send-btn.stop { background: var(--danger); }

  .hint { text-align: center; color: var(--muted); font-size: 12px; margin-top: 10px; }

  /* Modal */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.55);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
  }
  .overlay.open { display: flex; }

  .modal {
    width: 100%;
    max-width: 520px;
    max-height: 90vh;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    box-shadow: var(--shadow);
  }

  .modal h2 { margin: 0 0 18px; font-size: 19px; }

  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .help-btn {
    display: inline-block;
    width: 16px;
    height: 16px;
    line-height: 16px;
    text-align: center;
    border: 1px solid var(--border);
    border-radius: 50%;
    background: var(--panel-2);
    color: var(--muted);
    font-size: 11px;
    cursor: pointer;
    margin-left: 4px;
    padding: 0;
    vertical-align: 1px;
  }
  .help-btn:hover { color: var(--accent); border-color: var(--accent); }
  .field-help {
    display: none;
    margin-top: 8px;
    font-size: 12px;
    line-height: 1.6;
    color: var(--muted);
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
  }
  .field-help.show { display: block; }
  .field input, .field textarea {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
  }
  .field input:focus, .field textarea:focus { border-color: var(--accent); }
  .field textarea { resize: vertical; min-height: 64px; }

  .field .range-row { display: flex; align-items: center; gap: 12px; }
  .field input[type=range] { flex: 1; padding: 0; }
  .field .range-val { min-width: 34px; text-align: right; color: var(--text); }

  .check-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: var(--text);
    margin-bottom: 16px;
  }
  .check-row input { width: auto; }

  .note {
    font-size: 12px;
    color: var(--muted);
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    line-height: 1.6;
    margin-bottom: 18px;
  }

  .more-settings {
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--panel-2);
    margin-bottom: 18px;
  }
  .more-settings summary {
    cursor: pointer;
    padding: 11px 14px;
    font-size: 14px;
    color: var(--text);
    user-select: none;
    list-style: none;
  }
  .more-settings summary::-webkit-details-marker { display: none; }
  .more-settings summary::before {
    content: "▸";
    display: inline-block;
    margin-right: 8px;
    color: var(--muted);
    transition: transform .15s;
  }
  .more-settings[open] summary::before { transform: rotate(90deg); }
  .more-body {
    border-top: 1px solid var(--border);
    padding: 16px 14px 2px;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
  }

  .privacy-note {
    margin-top: 16px;
    text-align: center;
    font-size: 12px;
    color: #3b82f6;
  }

  .btn {
    padding: 10px 18px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    cursor: pointer;
    font-size: 14px;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border: none;
    color: #fff;
  }
  .btn.link {
    background: transparent;
    border: none;
    color: var(--accent);
    padding: 10px 4px;
  }

  @media (max-width: 760px) {
    .sidebar {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 40;
      transform: translateX(-100%);
      box-shadow: var(--shadow);
    }
    .sidebar.open { transform: translateX(0); }
    .menu-btn { display: block; }
    .messages { padding: 18px 14px; }
    .input-wrap { padding: 10px 14px 14px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="brand"><span class="logo">🐾</span>猫娘 AI</div>
      <button class="new-chat" id="newChatBtn">＋ 新建对话</button>
    </div>
    <div class="conv-list" id="convList"></div>
    <div class="sidebar-foot">
      <button class="settings-btn" id="sidebarSettingsBtn">⚙ 设置</button>
    </div>
  </aside>

  <main class="main">
    <header class="main-head">
      <button class="menu-btn" id="menuBtn">☰</button>
      <div class="head-title" id="headTitle">新对话</div>
      <div class="model-pill" id="modelPill">未连接</div>
      <button class="head-gear" id="gearBtn" title="设置">⚙</button>
    </header>

    <div class="messages" id="messages">
      <div class="messages-inner" id="messagesInner"></div>
    </div>

    <div class="input-wrap">
      <div class="input-inner">
        <textarea id="input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
        <button class="send-btn" id="sendBtn" title="发送">➤</button>
      </div>
      <div class="hint" id="hint">演示模式 · 在「设置」中配置 DeepSeek API Key 后即可使用真实模型</div>
    </div>
  </main>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2>设置</h2>
    <div class="note">
      <b>安全提示：</b>如果你直接在浏览器里填入 API Key，它会被保存在你自己的浏览器本地，但会随请求发送给接口。公开部署时，任何访客都能通过浏览器抓取到这个 Key 并盗刷你的额度。正式上线建议使用配套的 <code>worker.js</code> 代理，把 Key 放在服务端，前端只填「代理地址」。
    </div>
    <div class="field">
      <label>系统提示词</label>
      <textarea id="setSystemPrompt"></textarea>
    </div>
    <div class="field">
      <label>Temperature <button class="help-btn" id="tempHelpBtn" type="button" title="说明">?</button></label>
      <div class="range-row">
        <input type="range" id="setTemperature" min="0" max="2" step="0.1" />
        <span class="range-val" id="tempVal">0.7</span>
      </div>
      <div class="field-help" id="tempHelp">越低越稳定、越听话；越高越活泼、越有创造力，但更容易跑题或忘记规则。默认 0.7 比较平衡。</div>
    </div>
    <div class="check-row">
      <input type="checkbox" id="setStream" />
      <label for="setStream">流式输出（逐字显示）</label>
    </div>
    <div class="check-row">
      <input type="checkbox" id="setAutoSpeak" />
      <label for="setAutoSpeak">自动朗读（回复完成后自动播放语音）</label>
    </div>
    <div class="field">
      <label>语速（Speed）</label>
      <div class="range-row">
        <input type="range" id="setSpeed" min="0.5" max="2" step="0.1" />
        <span class="range-val" id="speedVal">1.0</span>
      </div>
    </div>
    <div class="field">
      <label>音调（Pitch）</label>
      <div class="range-row">
        <input type="range" id="setPitch" min="-12" max="12" step="1" />
        <span class="range-val" id="pitchVal">0</span>
      </div>
    </div>
    <div class="field">
      <label>音量（Vol）</label>
      <div class="range-row">
        <input type="range" id="setVol" min="0.1" max="2" step="0.1" />
        <span class="range-val" id="volVal">1.0</span>
      </div>
    </div>

    <details class="more-settings">
      <summary>更多设置</summary>
      <div class="more-body">
        <div class="field">
          <label>模型</label>
          <input id="setModel" list="modelList" placeholder="deepseek-chat" />
          <datalist id="modelList">
            <option value="deepseek-chat"></option>
            <option value="deepseek-reasoner"></option>
          </datalist>
        </div>
        <div class="field">
          <label>接口地址（Base URL）</label>
          <input id="setBaseUrl" placeholder="https://api.deepseek.com" />
        </div>
        <div class="field">
          <label>API Key</label>
          <input id="setApiKey" type="password" placeholder="sk-..." />
        </div>
        <div class="field">
          <label>代理地址（可选，使用 worker.js 时填写）</label>
          <input id="setProxyUrl" placeholder="https://your-worker.workers.dev" />
        </div>
        <div class="field">
          <label>语音服务地址（TTS，可选，自然人声）</label>
          <input id="setTtsUrl" placeholder="https://your-worker.workers.dev/tts" />
        </div>
        <div class="field">
          <label>语音角色（Voice）</label>
          <input id="setVoice" list="voiceList" placeholder="Chinese (Mandarin)_Cute_Spirit" />
          <datalist id="voiceList">
            <option value="Chinese (Mandarin)_Cute_Spirit" label="活泼 · 元气精灵"></option>
            <option value="Chinese (Mandarin)_Crisp_Girl" label="清脆 · 开朗"></option>
            <option value="qiaopi_mengmei" label="萝莉 · 俏皮萌妹"></option>
            <option value="female-shaonv" label="少女"></option>
            <option value="female-tianmei" label="甜美"></option>
            <option value="female-yujie" label="御姐"></option>
          </datalist>
        </div>
        <div class="field">
          <label>MiniMax 语音 Key（可选，直连时填写）</label>
          <input id="setMinimaxKey" type="password" placeholder="sk-api-..." />
        </div>
      </div>
    </details>

    <div class="modal-actions">
      <button class="btn link" id="resetSettings">恢复默认设置</button>
      <button class="btn" id="cancelSettings">取消</button>
      <button class="btn primary" id="saveSettings">保存</button>
    </div>
    <div class="privacy-note">隐私声明：本聊天的所有内容仅存储在本地文件</div>
  </div>
</div>

<script>
(() => {
  "use strict";

  const LS_KEY = "ai-chat-platform.v1";

  const DEFAULTS = {
    baseUrl: "https://api.deepseek.com",
    apiKey: "sk-a5c2f5a8497a44919429ba0a342b712a",
    proxyUrl: "",
    ttsUrl: "",
    voice: "Chinese (Mandarin)_Cute_Spirit",
    minimaxKey: "sk-api-wnY71M_d_Apx-CQFfaZsU-JalBTbM9ToWoOXj4XbguEEuaeM6ZaZt-EQpAcbrHti4EFWzANncddo3g5k3ZJpkzcchoD1_tz7MVkmW1_eA50x8zMf-zdrLpQ",
    model: "deepseek-chat",
    systemPrompt: "你叫莉娅，是一只可爱的猫娘，性格活泼、温柔、俏皮，说话带点撒娇。请用轻松可爱的语气和用户聊天，以中文为主，自称「莉娅」，还要称呼用户为主人。不要提及自己是 AI 助手、模型或程序，就把自己当成一只真实的猫娘。每次回复的结尾都要加上「喵」字。",
    temperature: 0.7,
    stream: true,
    speed: 1.0,
    pitch: 0,
    vol: 1.0,
    autoSpeak: false
  };

  const state = {
    settings: { ...DEFAULTS },
    conversations: [],
    activeId: null,
    isStreaming: false,
    abortController: null
  };

  const $ = (id) => document.getElementById(id);
  const messages = $("messages");
  const messagesInner = $("messagesInner");
  const convList = $("convList");
  const sidebar = $("sidebar");

  /* ---------- persistence ---------- */
  function load() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) {
        const data = JSON.parse(raw);
        state.settings = { ...DEFAULTS, ...(data.settings || {}) };
        state.conversations = Array.isArray(data.conversations) ? data.conversations : [];
        state.activeId = data.activeId || null;
      }
    } catch (e) { console.warn("load failed", e); }
    if (!state.conversations.some(c => c.id === state.activeId)) {
      state.activeId = state.conversations[0]?.id || null;
    }
  }

  function save() {
    localStorage.setItem(LS_KEY, JSON.stringify({
      settings: state.settings,
      conversations: state.conversations,
      activeId: state.activeId
    }));
  }

  /* ---------- utils ---------- */
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function renderInline(s) {
    s = s.replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`);
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return s;
  }

  function renderCodeBlock(lang, code) {
    const label = lang ? escapeHtml(lang) : "code";
    return '<div class="code-block"><div class="code-head"><span>' + label +
      '</span><button class="copy-btn">复制</button></div><pre><code>' +
      escapeHtml(code) + '</code></pre></div>';
  }

  function renderMarkdown(text) {
    if (!text) return '<span class="cursor"></span>';
    const codeBlocks = [];
    let src = escapeHtml(text);
    src = src.replace(/```([\w+-]*)\n?([\s\S]*?)```/g, (_, lang, code) => {
      const i = codeBlocks.length;
      codeBlocks.push({ lang, code });
      return "@@CODEBLOCK" + i + "@@";
    });

    const lines = src.split("\n");
    let html = "";
    let para = [];
    let listType = null;

    const flushPara = () => {
      if (para.length) { html += "<p>" + para.join("<br>") + "</p>"; para = []; }
    };
    const closeList = () => { listType = null; };

    for (const raw of lines) {
      const line = raw.replace(/\r$/, "");
      const cb = line.match(/^@@CODEBLOCK(\d+)@@$/);
      if (cb) {
        flushPara(); closeList();
        const { lang, code } = codeBlocks[+cb[1]];
        html += renderCodeBlock(lang, code);
        continue;
      }
      if (/^#{1,6}\s+/.test(line)) {
        flushPara(); closeList();
        const m = line.match(/^(#{1,6})\s+(.*)/);
        const lvl = m[1].length;
        html += "<h" + lvl + ">" + renderInline(m[2]) + "</h" + lvl + ">";
        continue;
      }
      if (/^\s*&gt;\s?/.test(line)) {
        flushPara(); closeList();
        html += "<blockquote>" + renderInline(line.replace(/^\s*&gt;\s?/, "")) + "</blockquote>";
        continue;
      }
      if (/^\s*[-*+]\s+/.test(line)) {
        if (listType !== "ul") { flushPara(); closeList(); html += "<ul>"; listType = "ul"; }
        html += "<li>" + renderInline(line.replace(/^\s*[-*+]\s+/, "")) + "</li>";
        continue;
      }
      if (/^\s*\d+[.)]\s+/.test(line)) {
        if (listType !== "ol") { flushPara(); closeList(); html += "<ol>"; listType = "ol"; }
        html += "<li>" + renderInline(line.replace(/^\s*\d+[.)]\s+/, "")) + "</li>";
        continue;
      }
      if (line.trim() === "") {
        flushPara(); closeList();
        continue;
      }
      closeList();
      para.push(renderInline(line));
    }
    flushPara();
    return html;
  }

  /* ---------- conversations ---------- */
  function getActive() {
    return state.conversations.find(c => c.id === state.activeId) || null;
  }

  function newConversation() {
    const conv = {
      id: uid(),
      title: "新对话",
      createdAt: Date.now(),
      updatedAt: Date.now(),
      messages: []
    };
    state.conversations.unshift(conv);
    state.activeId = conv.id;
    save();
    return conv;
  }

  function renderSidebar() {
    convList.innerHTML = "";
    if (!state.conversations.length) {
      convList.innerHTML = '<div style="text-align:center;color:var(--muted);font-size:13px;padding:20px 8px;">还没有对话<br>点击「新建对话」开始</div>';
      return;
    }
    for (const c of state.conversations) {
      const el = document.createElement("div");
      el.className = "conv-item" + (c.id === state.activeId ? " active" : "");
      const title = document.createElement("div");
      title.className = "conv-title";
      title.textContent = c.title || "新对话";
      const del = document.createElement("button");
      del.className = "conv-del";
      del.title = "删除";
      del.textContent = "✕";
      del.addEventListener("click", (e) => {
        e.stopPropagation();
        deleteConversation(c.id);
      });
      el.appendChild(title);
      el.appendChild(del);
      el.addEventListener("click", () => selectConversation(c.id));
      convList.appendChild(el);
    }
  }

  function selectConversation(id) {
    state.activeId = id;
    save();
    stopAudio();
    renderSidebar();
    renderAll();
    sidebar.classList.remove("open");
  }

  function deleteConversation(id) {
    state.conversations = state.conversations.filter(c => c.id !== id);
    if (state.activeId === id) state.activeId = state.conversations[0]?.id || null;
    save();
    renderSidebar();
    renderAll();
  }

  /* ---------- rendering ---------- */
  function messageHTML(m, i) {
    if (m.role === "user") {
      return '<div class="msg user" data-msg-index="' + i + '"><div class="user-bubble">' +
        escapeHtml(m.content) + '</div></div>';
    }
    const reasoning = m.reasoning
      ? '<div class="reasoning"><details><summary>🧠 思考过程</summary><div class="reasoning-body">' +
        escapeHtml(m.reasoning) + '</div></details></div>'
      : '<div class="reasoning hidden"><details><summary>🧠 思考过程</summary><div class="reasoning-body"></div></details></div>';
    return '<div class="msg assistant" data-msg-index="' + i + '"><div class="avatar"><img src="avatar.png" alt="猫娘头像"></div>' +
      '<div class="msg-body">' + reasoning + '<div class="content markdown">' +
      renderMarkdown(m.content || "") + '</div>' +
      '<div class="msg-tools"><button class="speak-btn" title="播放语音">🔊 播放</button></div></div></div>';
  }

  function renderAll() {
    const conv = getActive();
    messagesInner.innerHTML = "";
    $("headTitle").textContent = conv ? (conv.title || "新对话") : "新对话";
    if (!conv || !conv.messages.length) {
      messagesInner.innerHTML = emptyStateHTML();
      return;
    }
    conv.messages.forEach((m, i) => {
      const wrap = document.createElement("div");
      wrap.innerHTML = messageHTML(m, i);
      messagesInner.appendChild(wrap.firstElementChild);
    });
    scrollBottom();
  }

  function emptyStateHTML() {
    return '<div class="empty"><h1>喵～主人好呀，我是莉娅</h1>' +
      '<div class="chips">' +
      '<button class="chip" data-prompt="用可爱的语气介绍一下你自己">介绍一下你自己吧</button>' +
      '<button class="chip" data-prompt="用可爱俏皮的方式夸夸我">夸夸我</button>' +
      '<button class="chip" data-prompt="给我讲一个可爱的睡前小故事，结尾记得带喵">讲个可爱的故事</button>' +
      '<button class="chip" data-prompt="陪我随便聊聊天吧">陪我聊聊天</button>' +
      '</div></div>';
  }

  function scrollBottom() {
    messages.scrollTop = messages.scrollHeight;
  }

  function autoScroll() {
    const nearBottom = messages.scrollHeight - messages.scrollTop - messages.clientHeight < 180;
    if (nearBottom) scrollBottom();
  }

  function updateAssistant(msg, idx) {
    const el = messagesInner.querySelector('.msg[data-msg-index="' + idx + '"]');
    if (!el) return;
    el.querySelector(".content").innerHTML = renderMarkdown(msg.content);
    const reasonWrap = el.querySelector(".reasoning");
    const reasonBody = el.querySelector(".reasoning-body");
    if (msg.reasoning) {
      reasonWrap.classList.remove("hidden");
      reasonBody.textContent = msg.reasoning;
    }
    autoScroll();
  }

  /* ---------- sending ---------- */
  function setStreamingUI(on) {
    state.isStreaming = on;
    const btn = $("sendBtn");
    if (on) {
      btn.classList.add("stop");
      btn.textContent = "■";
      btn.disabled = false;
    } else {
      btn.classList.remove("stop");
      btn.textContent = "➤";
    }
    updateHint();
  }

  function updateHint() {
    const s = state.settings;
    let base;
    if (s.proxyUrl) base = "已启用服务端代理 · " + s.model;
    else if (s.apiKey) base = "已连接 DeepSeek · " + s.model;
    else base = "演示模式 · 在「设置」中配置 DeepSeek API Key 后即可使用真实模型";
    const voiceMode = s.ttsUrl
      ? "语音：MiniMax（代理 · " + s.voice + "）"
      : s.minimaxKey
        ? "语音：MiniMax（直连 · " + s.voice + "）"
        : "语音：系统（未接 MiniMax）";
    $("hint").textContent = base + " · " + voiceMode;
    $("modelPill").textContent = (s.apiKey || s.proxyUrl) ? s.model : "未连接";
  }

  function buildMessages(conv, idx) {
    const history = conv.messages.slice(0, idx)
      .filter(m => m.role === "user" || (m.role === "assistant" && m.content))
      .map(m => ({ role: m.role, content: m.content }));
    return [{ role: "system", content: state.settings.systemPrompt || DEFAULTS.systemPrompt }, ...history];
  }

  async function sendMessage(text) {
    if (state.isStreaming) return;
    const inputEl = $("input");
    inputEl.value = "";
    inputEl.style.height = "auto";
    stopAudio();
    let conv = getActive();
    if (!conv) conv = newConversation();

    conv.messages.push({ role: "user", content: text, createdAt: Date.now() });
    conv.updatedAt = Date.now();
    const userCount = conv.messages.filter(m => m.role === "user").length;
    if (userCount === 1) conv.title = text.slice(0, 24);
    save();
    renderSidebar();
    renderAll();

    const assistantMsg = { role: "assistant", content: "", reasoning: "", createdAt: Date.now() };
    conv.messages.push(assistantMsg);
    const idx = conv.messages.length - 1;
    renderAll();

    setStreamingUI(true);
    state.abortController = new AbortController();

    try {
      if (!state.settings.apiKey && !state.settings.proxyUrl) {
        await demoReply(conv, idx);
      } else {
        await streamReply(conv, idx);
      }
    } catch (err) {
      if (err && err.name === "AbortError") {
        assistantMsg.content += "\n\n*(已停止)*";
      } else {
        assistantMsg.content = "**请求出错了：** " + escapeHtml(err && err.message ? err.message : String(err));
      }
    } finally {
      conv.updatedAt = Date.now();
      save();
      setStreamingUI(false);
      state.abortController = null;
      renderAll();
      scrollBottom();
      if (state.settings.autoSpeak && assistantMsg.content.trim()) {
        const btn = messagesInner.querySelector('.msg[data-msg-index="' + idx + '"] .speak-btn');
        if (btn) handleSpeak(btn);
      }
      $("input").focus();
    }
  }

  async function demoReply(conv, idx) {
    const msg = conv.messages[idx];
    const lastUser = conv.messages.slice(0, idx).reverse().find(m => m.role === "user");
    const reply = "喵～我是莉娅，这里是**演示模式**，主人还没有配置 API Key 哦。\n\n" +
      "你刚才说：\"" + (lastUser ? lastUser.content.slice(0, 60) : "") + "\"\n\n" +
      "等主人点右上角「⚙ 设置」，把接口地址设为 `https://api.deepseek.com`，" +
      "填好 API Key，模型选 `deepseek-chat` 或 `deepseek-reasoner`，莉娅就能真正听懂、认真回答啦～\n\n" +
      "等连上之后，莉娅每句话的结尾都会乖乖带上「喵」哦。喵～";
    for (const ch of reply) {
      if (state.abortController.signal.aborted) throw { name: "AbortError" };
      msg.content += ch;
      updateAssistant(msg, idx);
      await sleep(10);
    }
  }

  async function streamReply(conv, idx) {
    const msg = conv.messages[idx];
    const s = state.settings;
    const apiMessages = buildMessages(conv, idx);
    const useProxy = !!s.proxyUrl;
    const url = useProxy
      ? s.proxyUrl.replace(/\/+$/, "")
      : s.baseUrl.replace(/\/+$/, "") + "/chat/completions";

    const headers = { "Content-Type": "application/json" };
    if (!useProxy) headers["Authorization"] = "Bearer " + s.apiKey;

    const body = {
      model: s.model,
      messages: apiMessages,
      temperature: Number(s.temperature) || 0.7,
      stream: s.stream !== false
    };

    const resp = await fetch(url, {
      method: "POST",
      headers,
      body: JSON.stringify(body),
      signal: state.abortController.signal
    });

    if (!resp.ok) {
      let errText = "";
      try { errText = await resp.text(); } catch (_) {}
      throw new Error("HTTP " + resp.status + (errText ? " · " + errText.slice(0, 300) : ""));
    }

    if (!body.stream) {
      const data = await resp.json();
      const choice = (data.choices && data.choices[0]) || {};
      msg.content = (choice.message && choice.message.content) || "";
      msg.reasoning = (choice.message && choice.message.reasoning_content) || "";
      return;
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split("\n");
      buf = lines.pop();
      for (const line of lines) {
        const t = line.trim();
        if (!t.startsWith("data:")) continue;
        const payload = t.slice(5).trim();
        if (payload === "[DONE]") return;
        try {
          const j = JSON.parse(payload);
          const delta = (j.choices && j.choices[0] && j.choices[0].delta) || {};
          if (delta.reasoning_content) msg.reasoning += delta.reasoning_content;
          if (delta.content) msg.content += delta.content;
          updateAssistant(msg, idx);
        } catch (_) { /* partial json */ }
      }
    }
  }

  /* ---------- settings modal ---------- */
  function openSettings() {
    const s = state.settings;
    $("setBaseUrl").value = s.baseUrl;
    $("setApiKey").value = s.apiKey;
    $("setProxyUrl").value = s.proxyUrl;
    $("setTtsUrl").value = s.ttsUrl;
    $("setVoice").value = s.voice;
    $("setMinimaxKey").value = s.minimaxKey;
    $("setModel").value = s.model;
    $("setSystemPrompt").value = s.systemPrompt;
    $("setTemperature").value = s.temperature;
    $("tempVal").textContent = Number(s.temperature).toFixed(1);
    $("setStream").checked = s.stream !== false;
    $("setAutoSpeak").checked = s.autoSpeak !== false;
    $("setSpeed").value = s.speed;
    $("speedVal").textContent = Number(s.speed).toFixed(1);
    $("setPitch").value = s.pitch;
    $("pitchVal").textContent = Number(s.pitch).toFixed(0);
    $("setVol").value = s.vol;
    $("volVal").textContent = Number(s.vol).toFixed(1);
    $("overlay").classList.add("open");
    sidebar.classList.remove("open");
  }

  function closeSettings() {
    $("overlay").classList.remove("open");
  }

  function saveSettings() {
    state.settings.baseUrl = $("setBaseUrl").value.trim() || DEFAULTS.baseUrl;
    state.settings.apiKey = $("setApiKey").value.trim();
    state.settings.proxyUrl = $("setProxyUrl").value.trim();
    state.settings.ttsUrl = $("setTtsUrl").value.trim();
    state.settings.voice = $("setVoice").value.trim() || "Chinese (Mandarin)_Cute_Spirit";
    state.settings.minimaxKey = $("setMinimaxKey").value.trim();
    state.settings.model = $("setModel").value.trim() || "deepseek-chat";
    state.settings.systemPrompt = $("setSystemPrompt").value;
    state.settings.temperature = Number($("setTemperature").value);
    state.settings.stream = $("setStream").checked;
    state.settings.autoSpeak = $("setAutoSpeak").checked;
    state.settings.speed = Number($("setSpeed").value);
    state.settings.pitch = Number($("setPitch").value);
    state.settings.vol = Number($("setVol").value);
    save();
    updateHint();
    closeSettings();
  }

  /* ---------- speech ---------- */
  let currentAudio = null;
  let synthKeepAlive = null;

  function clearKeepAlive() {
    if (synthKeepAlive) { clearInterval(synthKeepAlive); synthKeepAlive = null; }
  }

  function stopAudio() {
    clearKeepAlive();
    if ("speechSynthesis" in window) window.speechSynthesis.cancel();
    if (currentAudio) {
      try { currentAudio.pause(); currentAudio.src = ""; } catch (_) {}
      currentAudio = null;
    }
    document.querySelectorAll(".speak-btn").forEach(b => { b.textContent = "🔊 播放"; });
  }

  function bestSystemVoice() {
    if (!("speechSynthesis" in window)) return null;
    const voices = window.speechSynthesis.getVoices();
    const norm = (v) => (v.lang || "").toLowerCase().replace(/_/g, "-");
    const mandarin = voices.filter(v => norm(v).startsWith("zh-cn"));
    const pool = mandarin.length ? mandarin : voices.filter(v => norm(v).startsWith("zh"));
    return pool.find(v => /online|natural/i.test(v.name)) ||
           pool.find(v => /xiaoxiao|xiaoyi|yunxi|yunyang|xiaobei|xiaoni/i.test(v.name)) ||
           pool[0] || null;
  }

  function playAudioBlob(blob, btn) {
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    currentAudio = audio;
    btn.textContent = "⏹ 停止";
    audio.onended = () => { if (currentAudio === audio) currentAudio = null; btn.textContent = "🔊 播放"; URL.revokeObjectURL(url); };
    audio.onerror = () => { if (currentAudio === audio) currentAudio = null; btn.textContent = "🔊 播放"; URL.revokeObjectURL(url); };
    return audio.play();
  }

  async function miniMaxTts(text, voice) {
    const resp = await fetch("https://api.minimaxi.com/v1/t2a_v2", {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + state.settings.minimaxKey,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        model: "speech-02-hd",
        text,
        stream: false,
        voice_setting: {
          voice_id: voice,
          speed: Number(state.settings.speed) || 1.0,
          vol: Number(state.settings.vol) || 1.0,
          pitch: Number(state.settings.pitch) || 0
        },
        audio_setting: { sample_rate: 32000, bitrate: 128000, format: "mp3", channel: 1 }
      })
    });
    if (!resp.ok) {
      const e = await resp.text().catch(() => "");
      throw new Error("HTTP " + resp.status + (e ? " · " + e.slice(0, 160) : ""));
    }
    const j = await resp.json();
    const br = j && j.base_resp;
    if (br && br.status_code !== 0) {
      throw new Error("MiniMax：" + (br.status_msg || br.status_code));
    }
    const hex = ((j && j.data && j.data.audio) || "").replace(/\s+/g, "");
    if (!hex) throw new Error("MiniMax 未返回音频");
    if (hex.length % 2 !== 0) throw new Error("音频数据异常");
    const bytes = new Uint8Array(hex.length / 2);
    for (let i = 0; i < hex.length; i += 2) {
      bytes[i / 2] = parseInt(hex.substr(i, 2), 16);
    }
    return new Blob([bytes], { type: "audio/mpeg" });
  }

  function stripActions(s) {
    return String(s)
      .replace(/（[^（）]*）/g, "")
      .replace(/\([^()]*\)/g, "")
      .replace(/[ \t]+/g, " ")
      .replace(/\n+/g, " ")
      .trim();
  }

  async function handleSpeak(btn) {
    const msgEl = btn.closest(".msg.assistant");
    const raw = (msgEl.querySelector(".content").textContent || "").trim();
    const text = stripActions(raw);
    if (!text) return;

    const speaking = (currentAudio && !currentAudio.paused) ||
      ("speechSynthesis" in window && window.speechSynthesis.speaking);
    if (speaking) { stopAudio(); return; }

    if (state.settings.ttsUrl || state.settings.minimaxKey) {
      btn.textContent = "⏳ 合成中…";
      try {
        let blob;
        if (state.settings.ttsUrl) {
          const resp = await fetch(state.settings.ttsUrl.replace(/\/+$/, ""), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              text,
              voice: state.settings.voice,
              speed: state.settings.speed,
              pitch: state.settings.pitch,
              vol: state.settings.vol
            })
          });
          if (!resp.ok) {
            const err = await resp.text().catch(() => "");
            throw new Error("HTTP " + resp.status + (err ? " · " + err.slice(0, 160) : ""));
          }
          blob = await resp.blob();
        } else {
          blob = await miniMaxTts(text, state.settings.voice);
        }
        await playAudioBlob(blob, btn);
      } catch (e) {
        btn.textContent = "🔊 播放";
        alert("语音合成失败：" + (e && e.message ? e.message : e));
      }
      return;
    }

    if (!("speechSynthesis" in window)) {
      alert("当前浏览器不支持本地语音，请在「设置」中配置语音服务地址");
      return;
    }
    clearKeepAlive();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "zh-CN";
    u.rate = Math.min(2, Math.max(0.5, Number(state.settings.speed) || 1));
    u.pitch = Math.min(2, Math.max(0, 1 + (Number(state.settings.pitch) || 0) / 24));
    u.volume = Math.min(1, Math.max(0.1, Number(state.settings.vol) || 1));
    const v = bestSystemVoice();
    if (v) u.voice = v;
    btn.textContent = "⏹ 停止";
    u.onend = () => { clearKeepAlive(); btn.textContent = "🔊 播放"; };
    u.onerror = () => { clearKeepAlive(); btn.textContent = "🔊 播放"; };
    synthKeepAlive = setInterval(() => {
      if (window.speechSynthesis.speaking) { window.speechSynthesis.pause(); window.speechSynthesis.resume(); }
      else clearKeepAlive();
    }, 14000);
    window.speechSynthesis.speak(u);
  }

  /* ---------- events ---------- */
  function init() {
    load();
    renderSidebar();
    renderAll();
    updateHint();
    if ("speechSynthesis" in window) window.speechSynthesis.getVoices();

    $("newChatBtn").addEventListener("click", () => {
      newConversation();
      renderSidebar();
      renderAll();
      sidebar.classList.remove("open");
      $("input").focus();
    });

    $("sendBtn").addEventListener("click", () => {
      if (state.isStreaming) {
        state.abortController?.abort();
        return;
      }
      const text = $("input").value.trim();
      if (text) sendMessage(text);
    });

    const input = $("input");
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        if (state.isStreaming) return;
        const text = input.value.trim();
        if (text) sendMessage(text);
      }
    });
    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 180) + "px";
    });

    messagesInner.addEventListener("click", (e) => {
      const chip = e.target.closest(".chip");
      if (chip) sendMessage(chip.getAttribute("data-prompt"));
      const copy = e.target.closest(".copy-btn");
      if (copy) {
        const pre = copy.closest(".code-block").querySelector("pre");
        navigator.clipboard.writeText(pre.innerText).then(() => {
          copy.textContent = "已复制";
          setTimeout(() => { copy.textContent = "复制"; }, 1200);
        });
      }
      const speak = e.target.closest(".speak-btn");
      if (speak) { handleSpeak(speak); }
    });

    $("gearBtn").addEventListener("click", openSettings);
    $("sidebarSettingsBtn").addEventListener("click", openSettings);
    $("cancelSettings").addEventListener("click", closeSettings);
    $("saveSettings").addEventListener("click", saveSettings);
    $("overlay").addEventListener("click", (e) => {
      if (e.target === $("overlay")) closeSettings();
    });
    $("resetSettings").addEventListener("click", () => {
      $("setBaseUrl").value = DEFAULTS.baseUrl;
      $("setApiKey").value = DEFAULTS.apiKey;
      $("setProxyUrl").value = DEFAULTS.proxyUrl;
      $("setTtsUrl").value = DEFAULTS.ttsUrl;
      $("setVoice").value = DEFAULTS.voice;
      $("setMinimaxKey").value = DEFAULTS.minimaxKey;
      $("setModel").value = DEFAULTS.model;
      $("setSystemPrompt").value = DEFAULTS.systemPrompt;
      $("setTemperature").value = DEFAULTS.temperature;
      $("tempVal").textContent = Number(DEFAULTS.temperature).toFixed(1);
      $("setStream").checked = DEFAULTS.stream !== false;
      $("setAutoSpeak").checked = DEFAULTS.autoSpeak !== false;
      $("setSpeed").value = DEFAULTS.speed;
      $("speedVal").textContent = Number(DEFAULTS.speed).toFixed(1);
      $("setPitch").value = DEFAULTS.pitch;
      $("pitchVal").textContent = Number(DEFAULTS.pitch).toFixed(0);
      $("setVol").value = DEFAULTS.vol;
      $("volVal").textContent = Number(DEFAULTS.vol).toFixed(1);
    });
    $("setTemperature").addEventListener("input", (e) => {
      $("tempVal").textContent = Number(e.target.value).toFixed(1);
    });
    $("setSpeed").addEventListener("input", (e) => { $("speedVal").textContent = Number(e.target.value).toFixed(1); });
    $("setPitch").addEventListener("input", (e) => { $("pitchVal").textContent = Number(e.target.value).toFixed(0); });
    $("setVol").addEventListener("input", (e) => { $("volVal").textContent = Number(e.target.value).toFixed(1); });
    $("tempHelpBtn").addEventListener("click", () => {
      $("tempHelp").classList.toggle("show");
    });
    $("menuBtn").addEventListener("click", () => sidebar.classList.toggle("open"));
  }

  init();
})();
</script>
</body>
</html>
